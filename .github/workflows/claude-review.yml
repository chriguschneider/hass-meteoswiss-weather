name: Claude (review + auto-merge)

# Independent reviewer for agent PRs (branches `claude/*`). Opus reviews the
# PR adversarially, runs the tests, fixes substantive problems on the branch
# (bounded), then either enables auto-merge (green + solid) or hands it to a
# human. Same design as the sibling radar repo.
#
# Runs only on PR open / ready -- NOT on every push -- so the reviewer's own
# fix commits don't re-trigger it (no infinite loop). Re-run manually via the
# Actions tab if needed.

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true

jobs:
  review:
    # Only agent branches, and skip the reviewer's own bot pushes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.pull_request.head.ref, 'claude/') &&
       github.event.pull_request.draft == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
      cancel-in-progress: false
    steps:
      - name: Check the Claude token is configured
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping (see docs/agent-automation.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0

      - name: Review, fix (bounded), decide
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The author agent opens the PR as claude[bot]; allow that bot to
          # trigger this reviewer (default guard blocks bot-initiated runs).
          allowed_bots: "claude"
          claude_args: "--model claude-opus-4-8 --max-turns 60 --dangerously-skip-permissions"
          prompt: |
            You are an INDEPENDENT, adversarial reviewer for pull request
            #${{ github.event.pull_request.number || github.event.inputs.pr }}
            of this repository. You did NOT write it. Your job is to make one
            call: is this safe to auto-merge, or does it need a human?

            Set PR=${{ github.event.pull_request.number || github.event.inputs.pr }}.
            First run `gh pr checkout $PR` to get onto the PR branch, then read
            AGENTS.md, docs/adr/, docs/ogd.md and the linked issue.

            1. REVIEW the diff adversarially: correctness bugs, regressions,
               missed edge cases, whether it respects the traffic budget in
               ADR-0002 (no hourly bulk download more often than every 3 h,
               daily-only by default, conditional requests), whether it stays
               on the official open data (ADR-0001: no meteoswiss-app.ch, no
               website product JSON), and whether it actually resolves the
               linked issue. Run the checks:
               `pip install -r requirements_test.txt`,
               `ruff check custom_components tests scripts`, `pytest -q`.
            2. FIX substantive problems yourself on the PR branch (commit +
               push). Re-run the checks. **At most 3 fix rounds.** Do not fix
               pure style nits. Never push to `master`.
            3. DECIDE -- DEFAULT TO AUTO-MERGE:
               b. AUTO-MERGE whenever the checks are green and the change is
                  logically sound. Do NOT hold a change just because it
                  "would be nice to try in a real Home Assistant"; trust the
                  passing tests plus your own review. Mark it ready
                  (`gh pr ready $PR`), post a short comment ("LGTM" + one-line
                  rationale + what you fixed, if anything), and enable
                  auto-merge (`gh pr merge $PR --auto --squash`). Do NOT use
                  `--approve` (you cannot approve the app's own PR) and do NOT
                  force a merge.
               a. HOLD (`needs-verification`) ONLY in the rare case where the
                  change genuinely cannot be judged without a live Home
                  Assistant instance or a human decision AND a regression would
                  be clearly user-visible -- e.g. config-flow UX, entity naming
                  that users will build automations on. Also hold if the PR or
                  its issue already carries `needs-verification`, or you found
                  a real problem you could not fix within 3 rounds. Then add the
                  `needs-verification` label, comment exactly what a human must
                  check, and STOP.

            Never bypass required checks. When unsure between the two, prefer
            AUTO-MERGE -- the tests are green.
