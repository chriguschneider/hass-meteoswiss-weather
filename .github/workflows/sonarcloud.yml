name: SonarCloud

# ADR-0004. CI-based analysis because Automatic Analysis cannot accept an
# externally produced coverage report. Skips itself while SONAR_TOKEN is not
# configured, so a fresh clone of this setup is not red from day one.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check the Sonar token is configured
        id: token
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::SONAR_TOKEN is not set; skipping the SonarCloud scan (see sonar-project.properties)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
          # SonarCloud needs full history to attribute new code correctly;
          # a shallow clone makes every line look new.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - run: pip install -r requirements_test.txt
        if: steps.token.outputs.present == 'true'

      - name: Pytest with coverage
        if: steps.token.outputs.present == 'true'
        run: pytest -q --cov=custom_components --cov-report=xml

      - name: SonarCloud scan
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Block the job on a failing gate rather than reporting green
          # while the badge says otherwise.
          args: -Dsonar.qualitygate.wait=true
