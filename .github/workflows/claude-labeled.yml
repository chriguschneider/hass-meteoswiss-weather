name: Claude (opt-in via label)

# Opt-in automation: an issue is worked ONLY when it carries the `agent:go`
# label. Ideas without the label are never touched. Draft PRs only, never
# the default branch. Requires the CLAUDE_CODE_OAUTH_TOKEN secret; without
# it the job skips with a notice. See docs/agent-automation.md.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work on"
        required: true

jobs:
  work-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent:go')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # claude-code-action needs OIDC for its GitHub App token
    concurrency:
      group: claude-issue-${{ github.event.issue.number || github.event.inputs.issue }}
      cancel-in-progress: false
    steps:
      - name: Check the Claude token is configured
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping (see docs/agent-automation.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0

      - name: Pick model
        id: model
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number || github.event.inputs.issue }}"
          bash .github/scripts/pick-model.sh "$n" >> "$GITHUB_OUTPUT"

      - name: Implement and open a draft PR
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Headless worker: allow git / gh / build tools. Safe: isolated
          # runner, draft PRs only, human merges.
          claude_args: "--model ${{ steps.model.outputs.model }} --max-turns 100 --dangerously-skip-permissions"
          prompt: |
            You are working, unattended, on GitHub issue
            #${{ github.event.issue.number || github.event.inputs.issue }}
            of this repository. FIRST read AGENTS.md, docs/adr/ and docs/ogd.md,
            and follow the repo's own conventions and quality gates.

            Rules (non-negotiable):
            - Work on a branch `claude/<issue>-<short-slug>`. NEVER push to the
              default branch.
            - Run the repo's checks and make them pass before opening the PR:
              `pip install -r requirements_test.txt`,
              `ruff check custom_components tests scripts`, `pytest -q`.
            - You CANNOT modify files under `.github/workflows/` (the token lacks
              the `workflows` permission -- a deliberate safety boundary). If the
              fix needs a workflow change, describe the exact change in the PR
              and stop.
            - Open a **draft** PR with `gh pr create --draft` against the default
              branch, linking the issue
              (`Closes #${{ github.event.issue.number || github.event.inputs.issue }}`),
              summarising the change and how you verified it.
            - If the issue is ambiguous or you cannot verify the fix, DO NOT
              guess: open the draft PR with partial work and a clear
              "Blocked / needs decision" section, and stop.

      - name: Release the label on failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "${{ github.event.issue.number }}" --remove-label "agent:go" || true
