name: Upstream smoke test

# ADR-0004. The open data files are documented, but their layout is still
# an external contract: if MeteoSwiss renames a parameter, changes the
# point-id scheme or moves a collection, the integration quietly returns
# nothing. This job is the tripwire.
#
# Deliberately NOT part of PR checks: upstream drift is not a regression in
# a pull request, and an upstream outage must not block development.
#
# The script (tests/tools/smoke_test.py) is delivered through its own
# issue; until it exists the job skips with a notice instead of failing.

on:
  schedule:
    # Monday 02:00 UTC. GitHub disables cron on repos with no activity for
    # 60 days -- if this stops running, that is why.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    name: Fetch and parse live open data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # No secrets and no dependencies: the script uses urllib against the
      # unauthenticated open data endpoints, a handful of requests per run.
      - name: Run the smoke test
        id: smoke
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          if [ ! -f tests/tools/smoke_test.py ]; then
            echo "::notice::tests/tools/smoke_test.py does not exist yet; nothing to run."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tests/tools/smoke_test.py 2>&1 | tee smoke.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the drift issue
        if: steps.smoke.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream open data drift detected"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tail -c 4000 smoke.log > log-tail.txt

          {
            echo "The weekly smoke test could not fetch or parse the live MeteoSwiss open data."
            echo
            echo "- Run: $RUN_URL"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "\`\`\`"
            cat log-tail.txt
            echo "\`\`\`"
            echo
            echo "Per ADR-0004 this is tracked as an external contract change, not a repo regression."
            echo "Check docs/ogd.md and the MeteoSwiss changelog (https://opendatadocs.meteoswiss.ch/changelog) before touching the client."
          } > body.md

          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")"

          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body-file body.md
          else
            echo "Opening a new drift issue"
            # Labelled `bug`/`area-client` on purpose and NOT with a P-label:
            # the autopilot grinds the P-backlog, and it cannot fix MeteoSwiss
            # changing their files. A human triages this one.
            gh issue create --title "$TITLE" --body-file body.md \
              --label bug --label area-client
          fi

      - name: Note recovery on an open drift issue
        if: steps.smoke.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream open data drift detected"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body \
              "Smoke test passed again on $(date -u +%Y-%m-%d) ($RUN_URL). Left open for a human to confirm the layout actually matches docs/ogd.md before closing."
          fi

      - name: Fail the job if the smoke test failed
        if: steps.smoke.outputs.exit_code != '0'
        run: |
          echo "::error::Smoke test exited ${{ steps.smoke.outputs.exit_code }} -- see the drift issue."
          exit 1
