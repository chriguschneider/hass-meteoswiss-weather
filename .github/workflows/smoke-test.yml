name: Upstream smoke test

# ADR-0004. The open data files are documented, but their layout is still
# an external contract: if MeteoSwiss renames a parameter, changes the
# point-id scheme or moves a collection, the integration quietly returns
# nothing. This job is the tripwire.
#
# Deliberately NOT part of PR checks: upstream drift is not a regression in
# a pull request, and an upstream outage must not block development.
#
# The script (tests/tools/smoke_test.py) is delivered through its own
# issue; until it exists the job skips with a notice instead of failing.

on:
  schedule:
    # Monday 02:00 UTC. GitHub disables cron on repos with no activity for
    # 60 days -- if this stops running, that is why.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    name: Fetch and parse live open data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TITLE: "Upstream open data drift detected"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # No secrets and no dependencies: the script uses urllib against the
      # unauthenticated open data endpoints, a handful of requests per run.
      - name: Run the smoke test
        id: smoke
        env:
          # The script prints ✓/✗. On a stdout that is not UTF-8 the print
          # itself raises and the run reports drift that did not happen.
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          if [ ! -f tests/tools/smoke_test.py ]; then
            echo "::notice::tests/tools/smoke_test.py does not exist yet; nothing to run."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tests/tools/smoke_test.py 2>&1 | tee smoke.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the drift issue
        if: steps.smoke.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "The weekly smoke test could not fetch or parse the live MeteoSwiss open data."
            echo
            echo "- Run: $RUN_URL"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo '```'
            tail -c 4000 smoke.log
            echo '```'
            echo
            echo "Per ADR-0004 this is tracked as an external contract change, not a repo regression."
            echo "Check docs/ogd.md (and docs/slf.md for the SLF stations) and the MeteoSwiss changelog (https://opendatadocs.meteoswiss.ch/changelog) before touching the client."
          } > body.md

          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            echo "Opening a new drift issue"
            # `tracking` (every agent flow skips it) plus `bug`/`area-client`,
            # and NOT a P-label: the autopilot grinds the P-backlog, and it
            # cannot fix MeteoSwiss changing their files. A human triages
            # this one. Without the labels (not created yet) the issue is
            # opened bare rather than not at all.
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md \
              --label tracking --label bug --label area-client \
              || gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi

      - name: Note recovery on an open drift issue
        if: steps.smoke.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            # Left open on purpose: passing again does not prove the layout
            # is unchanged (an empty answer passes too). A human closes it.
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body \
              "Smoke test passed again on $(date -u +%Y-%m-%d) ($RUN_URL). Left open for a human to confirm the layout actually matches docs/ogd.md before closing."
          fi

      - name: Fail the job if the smoke test failed
        if: steps.smoke.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
        run: |
          echo "::error::Smoke test exited $EXIT_CODE -- see the drift issue \"$TITLE\"."
          exit 1
