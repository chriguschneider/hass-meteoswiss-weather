# SonarCloud, CI-based analysis (ADR-0004, inherited from the radar repo).
#
# Prerequisites (one-time, by the repo owner):
#   1. SonarCloud -> "Analyze new project" -> import this repository.
#   2. SonarCloud -> My Account -> Security -> generate a token.
#   3. Repo Settings -> Secrets -> Actions -> add SONAR_TOKEN.
#   4. SonarCloud project -> Administration -> Analysis Method ->
#      disable Automatic Analysis (conflicts with CI-based scanning).
# Until SONAR_TOKEN exists the workflow skips itself with a notice.

sonar.projectKey=chriguschneider_hass-meteoswiss-weather
sonar.organization=chriguschneider

sonar.sources=custom_components
sonar.tests=tests
sonar.test.inclusions=tests/**/test_*.py

# Python coverage: pytest --cov produces coverage.xml.
sonar.python.coverage.reportPaths=coverage.xml

# Non-runtime helpers excluded from coverage measurement:
#   tests/tools/ - smoke-test scripts run outside pytest
#   scripts/     - the brand icon generator, tested for its pure logic only
sonar.coverage.exclusions=tests/tools/**,scripts/**
